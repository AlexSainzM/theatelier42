<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Ventas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #f7f7f7;
    }

    .form-card {
      max-width: 950px;
      margin: 40px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .form-header {
      background: #212529;
      color: #fff;
      padding: 24px;
    }

    .product-row,
    .gift-row {
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fcfcfc;
    }

    .section-title {
      font-weight: 700;
      margin-bottom: 14px;
    }

    .summary-box {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .price-badge {
      font-size: 0.9rem;
    }

    .required-star {
      color: #dc3545;
    }

    .qty-stepper-wrap .qty-display {
      min-width: 2.75rem;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h1 class="h3 mb-1">Compra registrada</h1>
        <p class="mb-0">:)</p>
      </div>

      <div class="p-4 p-md-5">
        <a href="../index.html" class="btn btn-dark">Registrar otra compra</a>
      </div>
    </div>
  </div>

</body>
</html>
